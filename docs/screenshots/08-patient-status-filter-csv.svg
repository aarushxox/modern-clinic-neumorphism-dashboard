      <text x="1078" y="323" text-anchor="end" class="mono">INR 200</text>
    
      <rect x="96" y="368" width="1008" height="72" rx="18" fill="#ffffff" stroke="#e5e9f0" filter="url(#neuSm)"/>
      <circle cx="132" cy="404" r="18" fill="#e6f6ee"/>
      <text x="166" y="399" class="h2" font-size="14.5">Meera Nair</text>
      <rect x="292" y="383" width="112" height="22" rx="11" fill="#e6f6ee"/>
      <text x="348" y="398" text-anchor="middle" class="pill" fill="#267b54">Active</text>
      <text x="166" y="421" class="muted">#52524 · 36y Female · Type 2 Diabetes Follow-up</text>
      <rect x="720" y="384" width="204" height="40" rx="20" fill="#f8fafc" stroke="#edf0f5"/>
      <path d="M740,400 Q760,394 778,402 T812,396 T840,392" fill="none" stroke="#4aa97c" stroke-width="2.5" stroke-linecap="round"/>
      <text x="908" y="409" text-anchor="end" class="mono" fill="#4aa97c">72 bpm</text>
      <text x="1078" y="409" text-anchor="end" class="mono">INR 200</text>
    
      <rect x="96" y="454" width="1008" height="72" rx="18" fill="#ffffff" stroke="#e5e9f0" filter="url(#neuSm)"/>
      <circle cx="132" cy="490" r="18" fill="#eceff4"/>
      <text x="166" y="485" class="h2" font-size="14.5">Suresh Kulkarni</text>
