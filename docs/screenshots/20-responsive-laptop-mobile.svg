    <rect x="92" y="214" width="60" height="350" rx="14" fill="#e5ebf4"/>
    <rect x="166" y="214" width="418" height="42" rx="12" fill="#ffffff" stroke="#e5e9f0"/>
    <rect x="166" y="270" width="130" height="72" rx="16" fill="url(#lilacCard)"/>
    <rect x="310" y="270" width="130" height="72" rx="16" fill="url(#sageCard)"/>
    <rect x="454" y="270" width="130" height="72" rx="16" fill="url(#skyCard)"/>
    <rect x="166" y="358" width="268" height="206" rx="18" fill="#ffffff" stroke="#e5e9f0"/>
    <rect x="448" y="358" width="136" height="206" rx="18" fill="url(#sandCard)"/>

    <!-- Tablet Frame -->
    <rect x="636" y="162" width="268" height="428" rx="20" fill="#f8fafc" stroke="#d4dde9"/>
    <text x="660" y="196" class="lbl" fill="#267b54">TABLET (768PX)</text>
    <rect x="660" y="214" width="220" height="38" rx="12" fill="#ffffff" stroke="#e5e9f0"/>
    <rect x="660" y="266" width="104" height="72" rx="16" fill="url(#lilacCard)"/>
    <rect x="776" y="266" width="104" height="72" rx="16" fill="url(#sageCard)"/>
    <rect x="660" y="352" width="220" height="106" rx="16" fill="#ffffff" stroke="#e5e9f0"/>
    <rect x="660" y="470" width="220" height="94" rx="16" fill="url(#roseCard)"/>

    <!-- Mobile Frame -->
    <rect x="932" y="162" width="200" height="428" rx="26" fill="#f8fafc" stroke="#d4dde9"/>
    <text x="956" y="196" class="lbl" fill="#b44b6d">MOBILE (390PX)</text>
    <rect x="954" y="214" width="156" height="36" rx="12" fill="#ffffff" stroke="#e5e9f0"/>
    <rect x="954" y="264" width="156" height="66" rx="16" fill="url(#lilacCard)"/>
    <rect x="954" y="344" width="156" height="66" rx="16" fill="url(#skyCard)"/>
    <rect x="954" y="424" width="156" height="138" rx="16" fill="#ffffff" stroke="#e5e9f0"/>
    
  <text x="68" y="636" class="muted">Dr. Marcus Johnson Clinical Suite  |  Synthetic Preview UI  |  modern-clinic-neumorphism-dashboard</text>
  <text x="1132" y="636" text-anchor="end" class="mono" fill="#7f889a">PUBLIC UI SPEC</text>
</svg>
