  <text x="68" y="118" class="sub" >Filter daily consultations by Active, Pending Review, or Discharged, toggle HR/BP sparklines, and export RFC-4180 CSV.</text>
  <line x1="68" y1="136" x2="1132" y2="136" stroke="#edf0f5" stroke-width="1.5"/>
  
