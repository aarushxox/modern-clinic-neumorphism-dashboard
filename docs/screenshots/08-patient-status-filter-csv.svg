    <rect x="178" y="236" width="74" height="26" rx="13" fill="#ffffff" stroke="#e5e9f0"/><text x="215" y="253" text-anchor="middle" class="mono" font-size="11">10 Aug</text>
    <rect x="260" y="236" width="74" height="26" rx="13" fill="#ffffff" stroke="#e5e9f0"/><text x="297" y="253" text-anchor="middle" class="mono" font-size="11">11 Aug</text>
    <rect x="342" y="236" width="78" height="26" rx="13" fill="#eeebfb"/><text x="381" y="253" text-anchor="middle" class="mono" font-size="11" fill="#564aa8">12 Aug</text>

    <!-- 3 Patient Rows with Mini Sparklines -->
    
      <rect x="96" y="282" width="1008" height="72" rx="18" fill="#ffffff" stroke="#e5e9f0" filter="url(#neuSm)"/>
      <circle cx="132" cy="318" r="18" fill="#fdf2df"/>
