      <text x="166" y="507" class="muted">#52518 · 61y Male · Post-Viral Recovery Check</text>
      <rect x="720" y="470" width="204" height="40" rx="20" fill="#f8fafc" stroke="#edf0f5"/>
      <path d="M740,494 Q762,480 780,486 T812,474 T840,470" fill="none" stroke="#cf6e90" stroke-width="2.5" stroke-linecap="round"/>
      <text x="908" y="495" text-anchor="end" class="mono" fill="#cf6e90">98 bpm</text>
      <text x="1078" y="495" text-anchor="end" class="mono">INR 150</text>
    

    <rect x="96" y="544" width="1008" height="36" rx="12" fill="#eeebfb"/>
    <text x="116" y="567" class="mono" font-size="11.5" fill="#564aa8">CSV Output: clinic-patients-2026-08-12-pending-review.csv (UTF-8 BOM, 13 structured columns)</text>
    
