<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680">
  
  <defs>
    <filter id="neu" x="-6%" y="-6%" width="112%" height="116%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#202a40" flood-opacity="0.06"/>
      <feDropShadow dx="-2" dy="-2" stdDeviation="5" flood-color="#ffffff" flood-opacity="0.9"/>
    </filter>
    <filter id="neuSm" x="-8%" y="-8%" width="116%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#202a40" flood-opacity="0.06"/>
    </filter>
    <linearGradient id="bgLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f4f6f9"/>
      <stop offset="100%" stop-color="#eceff4"/>
    </linearGradient>
    <linearGradient id="sidebarGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e9eef5"/>
      <stop offset="100%" stop-color="#dfe6f0"/>
    </linearGradient>
    <linearGradient id="lilacCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ece8fb"/><stop offset="100%" stop-color="#e4def9"/>
    </linearGradient>
    <linearGradient id="sageCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e2f2eb"/><stop offset="100%" stop-color="#d8ede3"/>
    </linearGradient>
    <linearGradient id="roseCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fae9f0"/><stop offset="100%" stop-color="#f5dde7"/>
    </linearGradient>
    <linearGradient id="skyCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e1f1fb"/><stop offset="100%" stop-color="#d5eaf8"/>
    </linearGradient>
    <linearGradient id="sandCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbf0dd"/><stop offset="100%" stop-color="#f6e6cc"/>
    </linearGradient>
    <linearGradient id="limeCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eff5d1"/><stop offset="100%" stop-color="#e7f0be"/>
    </linearGradient>
  </defs>
  <style>
    .title { font: 700 22px "Outfit", "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, sans-serif; fill: #1c2230; }
    .sub { font: 500 13px "Plus Jakarta Sans", -apple-system, sans-serif; fill: #647086; }
    .lbl { font: 700 11px "Plus Jakarta Sans", -apple-system, sans-serif; letter-spacing: 0.08em; fill: #6f63c8; }
    .h2 { font: 700 16px "Outfit", "Plus Jakarta Sans", sans-serif; fill: #1c2230; }
    .body { font: 500 13px "Plus Jakarta Sans", sans-serif; fill: #4e5668; }
    .mono { font: 600 12px "JetBrains Mono", ui-monospace, monospace; fill: #1c2230; }
    .muted { font: 500 11.5px "Plus Jakarta Sans", sans-serif; fill: #7f889a; }
    .pill { font: 700 11px "Plus Jakarta Sans", sans-serif; }
  </style>

  <rect width="1200" height="680" fill="url(#bgLight)" rx="0"/>
  <rect x="36" y="28" width="1128" height="624" rx="28" fill="#ffffff" stroke="#e5e9f0" stroke-width="1.5" filter="url(#neu)"/>
  <text x="68" y="66" class="lbl" >HEADER NOTIFICATION SYSTEM  /  SCHEDULE-SYNCED ALERTS</text>
  <text x="68" y="96" class="title" >Critical Clinical Reminders Banner & Notification Overlay</text>
  <text x="68" y="118" class="sub" >Real-time schedule reminders with severity badges, quick chart jump, and dismissible bell popover.</text>
  <line x1="68" y1="136" x2="1132" y2="136" stroke="#edf0f5" stroke-width="1.5"/>
  
    <!-- Top Header Strip -->
    <rect x="68" y="156" width="1064" height="58" rx="18" fill="#f8fafc" stroke="#e5e9f0"/>
    <circle cx="102" cy="185" r="18" fill="#ffffff" stroke="#e5e9f0" filter="url(#neuSm)"/>
    <line x1="94" y1="179" x2="110" y2="179" stroke="#1c2230" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="94" y1="185" x2="110" y2="185" stroke="#1c2230" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="94" y1="191" x2="110" y2="191" stroke="#1c2230" stroke-width="2.2" stroke-linecap="round"/>
    <text x="134" y="189" class="body">Workspace / <tspan font-weight="700" fill="#1c2230">Overview</tspan></text>
    <rect x="650" y="169" width="210" height="32" rx="16" fill="#ffffff" stroke="#e5e9f0"/>
    <text x="670" y="189" class="muted">Search patients, #serial...</text>
    <circle cx="888" cy="185" r="17" fill="#eeebfb" stroke="#d8cff5"/>
    <circle cx="899" cy="172" r="9" fill="#e11d48"/>
    <text x="899" y="176" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="700" font-family="monospace">4</text>
    <rect x="920" y="169" width="112" height="32" rx="16" fill="#ffffff" stroke="#e5e9f0"/>
    <text x="976" y="189" text-anchor="middle" class="pill" fill="#1c2230">Print View</text>
    <circle cx="1060" cy="185" r="17" fill="#ffffff" stroke="#e5e9f0"/>
    <circle cx="1102" cy="185" r="17" fill="#e3dbe8"/>
    <text x="1102" y="189" text-anchor="middle" class="pill" fill="#1c2230">MJ</text>

    <!-- Active Clinical Reminder Banner -->
    <rect x="68" y="226" width="1064" height="46" rx="14" fill="url(#roseCard)" stroke="#f4d0dd"/>
    <rect x="86" y="238" width="128" height="22" rx="11" fill="#ffffff"/>
    <text x="150" y="253" text-anchor="middle" class="pill" fill="#b44b6d">CRITICAL · URGENT</text>
    <text x="230" y="253" class="body"><tspan font-weight="700" fill="#1c2230">Urgent Lab Report Pending</tspan> — Patient #52512 · CBC, HbA1c &amp; metabolic panel awaiting review</text>
    <rect x="910" y="236" width="98" height="26" rx="13" fill="#ffffff" stroke="#f4d0dd"/>
    <text x="959" y="253" text-anchor="middle" class="pill" fill="#1c2230">Review Lab</text>
    <text x="1032" y="253" class="pill" fill="#b44b6d">All alerts (4)</text>

    <!-- Overlay Popover Showcase -->
    <rect x="68" y="294" width="540" height="304" rx="22" fill="#f8fafc" stroke="#e5e9f0"/>
    <text x="96" y="328" class="h2">Schedule-Driven Alert Triggers</text>
    <rect x="96" y="346" width="484" height="68" rx="16" fill="#ffffff" stroke="#e5e9f0" filter="url(#neuSm)"/>
    <rect x="112" y="362" width="84" height="20" rx="10" fill="#efebfb"/>
    <text x="154" y="376" text-anchor="middle" class="pill" fill="#6152b3">IN 10 MIN</text>
    <text x="208" y="376" class="h2" font-size="14">Upcoming Appointment in 10 minutes</text>
    <text x="112" y="399" class="muted">Retrieved automatically from active clinic date schedule (#52530)</text>

    <rect x="96" y="428" width="484" height="68" rx="16" fill="#ffffff" stroke="#f4d0dd" filter="url(#neuSm)"/>
    <rect x="112" y="444" width="84" height="20" rx="10" fill="#fcebf1"/>
    <text x="154" y="458" text-anchor="middle" class="pill" fill="#b44b6d">CRITICAL</text>
    <text x="208" y="458" class="h2" font-size="14">Urgent Lab Report Pending</text>
    <text x="112" y="481" class="muted">Flags high-priority HTN, DM, and pyrexia workup investigations</text>

    <rect x="96" y="510" width="484" height="68" rx="16" fill="#ffffff" stroke="#f2dbb1" filter="url(#neuSm)"/>
    <rect x="112" y="526" width="84" height="20" rx="10" fill="#fdf2df"/>
    <text x="154" y="540" text-anchor="middle" class="pill" fill="#9c6a22">DUE 25 MIN</text>
    <text x="208" y="540" class="h2" font-size="14">Vitals &amp; Dosage Verification Due</text>
    <text x="112" y="563" class="muted">One-click jump directly into PatientProfileModal or OPD Roster</text>

    <!-- Right: Bell Notification Popover Card -->
    <rect x="642" y="294" width="490" height="304" rx="22" fill="#ffffff" stroke="#e5e9f0" filter="url(#neu)"/>
    <rect x="642" y="294" width="490" height="58" rx="22" fill="#f4f6f9"/>
    <text x="668" y="324" class="h2">Clinical Reminders</text>
    <rect x="826" y="308" width="96" height="22" rx="11" fill="#efebfb"/>
    <text x="874" y="323" text-anchor="middle" class="mono" font-size="10.5" fill="#6152b3">Aug 12, 2026</text>
    <text x="1104" y="324" text-anchor="end" class="pill" fill="#6f63c8">Clear all</text>
    <rect x="664" y="368" width="446" height="62" rx="14" fill="#f8fafc" stroke="#edf0f5"/>
    <text x="682" y="392" class="h2" font-size="13.5">Upcoming Appointment in 10 minutes</text>
    <text x="682" y="414" class="muted">Next scheduled walk-in triage consultation · Open Chart</text>
    <rect x="664" y="442" width="446" height="62" rx="14" fill="#fcebf1" stroke="#f4d0dd"/>
    <text x="682" y="466" class="h2" font-size="13.5">Urgent Lab Report Pending</text>
    <text x="682" y="488" class="muted">HbA1c &amp; Lipid Panel ready for sign-off · Review Lab</text>
    <rect x="664" y="516" width="446" height="62" rx="14" fill="#f8fafc" stroke="#edf0f5"/>
    <text x="682" y="540" class="h2" font-size="13.5">22 OPD Encounters on Schedule</text>
    <text x="682" y="562" class="muted">Click any alert to open chart or switch clinic day · View Schedule</text>
    
  <text x="68" y="636" class="muted" >Dr. Marcus Johnson Clinical Suite  |  Synthetic Preview UI  |  modern-clinic-neumorphism-dashboard</text>
  <text x="1132" y="636" text-anchor="end" class="mono" fill="#7f889a">PUBLIC UI SPEC</text>
</svg>
