<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680">
  
  <defs>
    <filter id="neu" x="-6%" y="-6%" width="112%" height="116%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#202a40" flood-opacity="0.06"/>
      <feDropShadow dx="-2" dy="-2" stdDeviation="5" flood-color="#ffffff" flood-opacity="0.9"/>
    </filter>
    <filter id="neuSm" x="-8%" y="-8%" width="116%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#202a40" flood-opacity="0.06"/>
    </filter>
    <linearGradient id="bgLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f4f6f9"/>
      <stop offset="100%" stop-color="#eceff4"/>
    </linearGradient>
    <linearGradient id="sidebarGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e9eef5"/>
      <stop offset="100%" stop-color="#dfe6f0"/>
    </linearGradient>
    <linearGradient id="lilacCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ece8fb"/><stop offset="100%" stop-color="#e4def9"/>
    </linearGradient>
    <linearGradient id="sageCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e2f2eb"/><stop offset="100%" stop-color="#d8ede3"/>
    </linearGradient>
    <linearGradient id="roseCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fae9f0"/><stop offset="100%" stop-color="#f5dde7"/>
    </linearGradient>
    <linearGradient id="skyCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e1f1fb"/><stop offset="100%" stop-color="#d5eaf8"/>
    </linearGradient>
    <linearGradient id="sandCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbf0dd"/><stop offset="100%" stop-color="#f6e6cc"/>
    </linearGradient>
    <linearGradient id="limeCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eff5d1"/><stop offset="100%" stop-color="#e7f0be"/>
    </linearGradient>
  </defs>
  <style>
    .title { font: 700 22px "Outfit", "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, sans-serif; fill: #1c2230; }
    .sub { font: 500 13px "Plus Jakarta Sans", -apple-system, sans-serif; fill: #647086; }
    .lbl { font: 700 11px "Plus Jakarta Sans", -apple-system, sans-serif; letter-spacing: 0.08em; fill: #6f63c8; }
    .h2 { font: 700 16px "Outfit", "Plus Jakarta Sans", sans-serif; fill: #1c2230; }
    .body { font: 500 13px "Plus Jakarta Sans", sans-serif; fill: #4e5668; }
    .mono { font: 600 12px "JetBrains Mono", ui-monospace, monospace; fill: #1c2230; }
    .muted { font: 500 11.5px "Plus Jakarta Sans", sans-serif; fill: #7f889a; }
    .pill { font: 700 11px "Plus Jakarta Sans", sans-serif; }
  </style>

  <rect width="1200" height="680" fill="url(#bgLight)" rx="0"/>
  <rect x="36" y="28" width="1128" height="624" rx="28" fill="#ffffff" stroke="#e5e9f0" stroke-width="1.5" filter="url(#neu)"/>
  <text x="68" y="66" class="lbl" >MICRO-INTERACTIONS  /  MOTION 12, SHIMMER SKELETONS &amp; TOASTS</text>
  <text x="68" y="96" class="title" >0.8s Page Skeletons, Toast Feedback &amp; Keyboard Navigation</text>
  <text x="68" y="118" class="sub" >Silky page transitions using Motion 12, contextual skeleton loaders, toast notifications, and global hotkeys.</text>
  <line x1="68" y1="136" x2="1132" y2="136" stroke="#edf0f5" stroke-width="1.5"/>
  
    <!-- Skeleton Preview -->
    <rect x="68" y="160" width="340" height="432" rx="22" fill="#f8fafc" stroke="#e5e9f0"/>
    <text x="94" y="196" class="lbl">0.8S PAGE SKELETON</text>
    <text x="94" y="220" class="h2">Shimmer Loading Shell</text>
    <rect x="94" y="244" width="288" height="24" rx="12" fill="#e5e9f0"/>
    <rect x="94" y="280" width="136" height="84" rx="18" fill="#e5e9f0"/>
    <rect x="246" y="280" width="136" height="84" rx="18" fill="#e5e9f0"/>
    <rect x="94" y="380" width="288" height="128" rx="18" fill="#e5e9f0"/>
    <text x="94" y="540" class="muted">Module-aware skeletons prevent abrupt</text>
    <text x="94" y="560" class="muted">layout pop-in on every view transition.</text>

    <!-- Toast Notifications -->
    <rect x="434" y="160" width="340" height="432" rx="22" fill="#f8fafc" stroke="#e5e9f0"/>
    <text x="460" y="196" class="lbl" fill="#267b54">TOAST PROVIDER</text>
    <text x="460" y="220" class="h2">Contextual Action Alerts</text>
    <rect x="460" y="250" width="288" height="78" rx="18" fill="#ffffff" stroke="#c5e8d6" filter="url(#neuSm)"/>
    <text x="482" y="280" class="pill" fill="#267b54">CSV EXPORT COMPLETE</text>
    <text x="482" y="304" class="muted">Downloaded 22 patient records (.csv)</text>

    <rect x="460" y="346" width="288" height="78" rx="18" fill="#ffffff" stroke="#d8cff5" filter="url(#neuSm)"/>
    <text x="482" y="376" class="pill" fill="#6152b3">KEYBOARD NAVIGATION</text>
    <text x="482" y="400" class="muted">Switched to Patients Directory (Ctrl+S)</text>

    <rect x="460" y="442" width="288" height="78" rx="18" fill="#ffffff" stroke="#f2dbb1" filter="url(#neuSm)"/>
    <text x="482" y="472" class="pill" fill="#9c6a22">PATIENT ONBOARDED</text>
    <text x="482" y="496" class="muted">Reg #52534 added to today OPD queue</text>

    <!-- Keyboard Shortcut Matrix -->
    <rect x="800" y="160" width="332" height="432" rx="22" fill="#f8fafc" stroke="#e5e9f0"/>
    <text x="826" y="196" class="lbl" fill="#2b6ea6">GLOBAL HOTKEYS</text>
    <text x="826" y="220" class="h2">Power-User Shortcuts</text>
    
      <rect x="826" y="240" width="84" height="26" rx="8" fill="#ffffff" stroke="#d4dde9"/>
      <text x="868" y="257" text-anchor="middle" class="mono" font-size="11">Ctrl + D</text>
      <text x="926" y="257" class="body" font-size="12.5">Overview Dashboard</text>
    
      <rect x="826" y="276" width="84" height="26" rx="8" fill="#ffffff" stroke="#d4dde9"/>
      <text x="868" y="293" text-anchor="middle" class="mono" font-size="11">Ctrl + S</text>
      <text x="926" y="293" class="body" font-size="12.5">Patients Directory</text>
    
      <rect x="826" y="312" width="84" height="26" rx="8" fill="#ffffff" stroke="#d4dde9"/>
      <text x="868" y="329" text-anchor="middle" class="mono" font-size="11">Ctrl + T</text>
      <text x="926" y="329" class="body" font-size="12.5">Today Clinic OPD</text>
    
      <rect x="826" y="348" width="84" height="26" rx="8" fill="#ffffff" stroke="#d4dde9"/>
      <text x="868" y="365" text-anchor="middle" class="mono" font-size="11">Ctrl + M</text>
      <text x="926" y="365" class="body" font-size="12.5">Medicines Formulary</text>
    
      <rect x="826" y="384" width="84" height="26" rx="8" fill="#ffffff" stroke="#d4dde9"/>
      <text x="868" y="401" text-anchor="middle" class="mono" font-size="11">Ctrl + K</text>
      <text x="926" y="401" class="body" font-size="12.5">Rx Shortcuts</text>
    
      <rect x="826" y="420" width="84" height="26" rx="8" fill="#ffffff" stroke="#d4dde9"/>
      <text x="868" y="437" text-anchor="middle" class="mono" font-size="11">Alt + R</text>
      <text x="926" y="437" class="body" font-size="12.5">Clinical Analytics</text>
    
      <rect x="826" y="456" width="84" height="26" rx="8" fill="#ffffff" stroke="#d4dde9"/>
      <text x="868" y="473" text-anchor="middle" class="mono" font-size="11">Alt + J</text>
      <text x="926" y="473" class="body" font-size="12.5">Cashbook Journal</text>
    
      <rect x="826" y="492" width="84" height="26" rx="8" fill="#ffffff" stroke="#d4dde9"/>
      <text x="868" y="509" text-anchor="middle" class="mono" font-size="11">Ctrl + /</text>
      <text x="926" y="509" class="body" font-size="12.5">Walkthrough Modal</text>
    
      <rect x="826" y="528" width="84" height="26" rx="8" fill="#ffffff" stroke="#d4dde9"/>
      <text x="868" y="545" text-anchor="middle" class="mono" font-size="11">Esc</text>
      <text x="926" y="545" class="body" font-size="12.5">Close Active Overlay</text>
    
    
  <text x="68" y="636" class="muted" >Dr. Marcus Johnson Clinical Suite  |  Synthetic Preview UI  |  modern-clinic-neumorphism-dashboard</text>
  <text x="1132" y="636" text-anchor="end" class="mono" fill="#7f889a">PUBLIC UI SPEC</text>
</svg>
